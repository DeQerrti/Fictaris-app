<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Fictaris</title>
<link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css" />
<script>
  // Тема из кэша — синхронно, до первой отрисовки, иначе долю секунды
  // видно тёмную тему по умолчанию, а потом она подменяется на
  // выбранную (см. app/js/theme.js, applyTheme). Сеть на телефоне и на
  // компьютере отвечает не мгновенно, а мигание темы при каждой
  // загрузке страницы — то, чего этот кэш и должен избежать.
  try {
    const cached = JSON.parse(localStorage.getItem("fictaris_theme_cache") || "null");
    if (cached && cached.skin) {
      document.documentElement.setAttribute("data-skin", cached.skin);
      if (cached.accent) {
        const style = document.createElement("style");
        style.id = "theme-overrides";
        style.textContent = `:root { --accent: ${cached.accent}; }`;
        document.head.appendChild(style);
      }
    }
  } catch {}
</script>
</head>
<body>
  <div id="app">
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Меню">☰</button>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <nav class="sidebar">
      <div class="brand">Fictaris</div>
      <div class="project-switcher">
        <button class="project-current" id="projectBtn">…</button>
        <div class="project-menu" id="projectMenu"></div>
      </div>
      <button class="search-trigger" id="searchTrigger">🔍 Поиск <span class="search-trigger-hint">/</span></button>
      <button class="nav-item active" data-module="manuscript">Рукопись</button>
      <button class="nav-item" data-module="characters">Персонажи</button>
      <button class="nav-item" data-module="locations">Локации</button>
      <button class="nav-item" data-module="relationships">Связи</button>
      <button class="nav-item" data-module="factions">Фракции</button>
      <button class="nav-item" data-module="timeline">Таймлайн</button>
      <button class="nav-item" data-module="board">Доска</button>
      <button class="nav-item" data-module="map">Карта</button>
      <button class="nav-item" data-module="graph">Граф</button>
      <button class="nav-item" data-module="familytree">Родословная</button>
      <button class="nav-item" data-module="stats">Статистика</button>
      <div class="sidebar-spacer"></div>
      <button class="nav-item" data-module="continuity">Проверка</button>
      <button class="nav-item" data-module="trash">Корзина <span class="trash-badge" id="trashBadge"></span></button>
      <button class="nav-item" data-module="settings">⚙ Настройки</button>
      <div class="save-badge" id="saveBadge">Сохранено</div>
    </nav>
    <main id="content"></main>
  </div>
  <script src="/js/mobile.bundle.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
