<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Fictaris</title>
<link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css" />
<script>
  // Тема из кэша — синхронно, до первой отрисовки, иначе долю секунды
  // видно тёмную тему по умолчанию, а потом она подменяется на
  // выбранную (см. app/js/theme.js, applyTheme). Сеть на телефоне и на
  // компьютере отвечает не мгновенно, а мигание темы при каждой
  // загрузке страницы — то, чего этот кэш и должен избежать.
  try {
    const cached = JSON.parse(localStorage.getItem("fictaris_theme_cache") || "null");
    if (cached && cached.skin) {
      document.documentElement.setAttribute("data-skin", cached.skin);
      // Та же карта ключ→CSS-переменная, что и CUSTOM_COLOR_TOKENS в
      // app/js/theme.js — здесь копия нарочно: это синхронный инлайн-
      // скрипт до всякой загрузки модулей, ему взять её больше неоткуда.
      const CSS_VAR = {
        bg: "--bg", panelAlt: "--panel-alt", card: "--card", panel: "--panel",
        border: "--border", text: "--text", textDim: "--text-dim", textFaint: "--text-faint",
      };
      const vars = [];
      if (cached.accent) vars.push(`--accent: ${cached.accent}`);
      for (const [key, cssVar] of Object.entries(CSS_VAR)) {
        const v = cached.customColors && cached.customColors[key];
        if (/^#[0-9a-f]{6}$/i.test(v || "")) vars.push(`${cssVar}: ${v}`);
      }
      if (vars.length) {
        const style = document.createElement("style");
        style.id = "theme-overrides";
        style.textContent = `:root { ${vars.join("; ")}; }`;
        document.head.appendChild(style);
      }
    }
  } catch {}
</script>
</head>
<body>
  <div id="app">
    <button class="sidebar-toggle" id="sidebarToggle" data-i18n aria-label="Меню">☰</button>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <nav class="sidebar">
      <div class="sidebar-resize-handle" id="sidebarResizeHandle"></div>
      <div class="sb-head">
        <div class="project-switcher">
          <button class="sb-world" id="projectBtn" data-i18n title="Сменить мир">
            <img class="sb-appicon" src="/icons/icon-512.png" alt="">
            <span class="sb-world-text">
              <span class="sb-world-name" id="projectName">…</span>
              <span class="sb-world-sub" id="sbWorldSub"></span>
            </span>
            <span class="sb-world-chev" id="sbWorldChev"></span>
          </button>
          <div class="project-menu" id="projectMenu"></div>
        </div>
        <button class="sb-search" id="sbSearch" data-i18n title="Найти или перейти" aria-label="Найти или перейти"><span class="sb-search-icon"></span><span class="sb-search-text" id="sbSearchText"></span><kbd class="sb-kbd">/</kbd></button>
      </div>
      <div class="sidebar-nav">
        <div class="sb-now" id="sbNow" hidden></div>
        <div class="nav-group-label" data-section="plot"></div>
        <div class="sb-section" data-section="plot">
          <button class="nav-item active" data-module="manuscript">Рукопись</button>
          <div class="sb-books" id="sbBooks"></div>
          <button class="nav-item" data-module="board">Доска</button>
        </div>
        <div class="nav-group-label" data-section="world"></div>
        <div class="sb-section sb-tiles" data-section="world">
          <button class="nav-item nav-tile" data-module="characters">Персонажи</button>
          <button class="nav-item nav-tile" data-module="locations">Локации</button>
          <button class="nav-item nav-tile" data-module="factions">Фракции</button>
          <button class="nav-item nav-tile" data-module="timeline">Таймлайн</button>
        </div>
        <div class="nav-group-label" data-section="views"></div>
        <div class="sb-section sb-views" data-section="views">
          <button class="nav-item nav-view" data-module="map">Карта</button>
          <button class="nav-item nav-view" data-module="familytree">Родословная</button>
          <button class="nav-item nav-view" data-module="graph">Отношения</button>
          <button class="nav-item nav-view" data-module="canvas">Холст</button>
        </div>
        <div class="sb-recent" id="sbRecent" hidden></div>
        <div class="sidebar-spacer"></div>
      </div>
      <div class="sb-foot">
        <button class="settings-btn sb-foot-btn" id="continuityBtn" data-i18n title="Проверка мира" aria-label="Проверка мира"><span class="sb-foot-badge warn" id="continuityBadge"></span></button>
        <button class="settings-btn sb-foot-btn" id="trashBtn" data-i18n title="Корзина" aria-label="Корзина"><span class="sb-foot-badge" id="trashBadge"></span></button>
        <button class="settings-btn sb-foot-btn" id="statsBtn" data-i18n title="Статистика" aria-label="Статистика"></button>
        <button class="settings-btn sb-foot-btn" id="settingsBtn" data-i18n data-module="settings" title="Настройки" aria-label="Настройки"></button>
        <span class="sb-foot-spacer"></span>
        <button class="settings-btn sb-foot-btn" id="sidebarMode" data-i18n title="Вид панели" aria-label="Вид панели"></button>
      </div>
      <div class="save-badge" id="saveBadge" data-i18n title="Статус последнего сохранения на диск в папке проекта – «Сохранено» значит, что все изменения уже записаны в файлы">Сохранено</div>
    </nav>
    <main id="content"></main>
  </div>
  <script src="/js/electron-bridge.js"></script>
  <script src="/js/mobile.bundle.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
