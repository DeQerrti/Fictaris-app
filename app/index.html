<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Fictaris</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Меню">☰</button>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <nav class="sidebar">
      <div class="brand">Fictaris</div>
      <div class="project-switcher">
        <button class="project-current" id="projectBtn">…</button>
        <div class="project-menu" id="projectMenu"></div>
      </div>
      <button class="nav-item active" data-module="manuscript">Рукопись</button>
      <button class="nav-item" data-module="characters">Персонажи</button>
      <button class="nav-item" data-module="locations">Локации</button>
      <button class="nav-item" data-module="relationships">Связи</button>
      <button class="nav-item" data-module="factions">Фракции</button>
      <button class="nav-item" data-module="timeline">Таймлайн</button>
      <button class="nav-item" data-module="board">Доска</button>
      <button class="nav-item" data-module="map">Карта</button>
      <button class="nav-item" data-module="graph">Граф</button>
      <div class="sidebar-spacer"></div>
      <button class="nav-item" data-module="continuity">Проверка</button>
      <button class="nav-item" data-module="trash">Корзина <span class="trash-badge" id="trashBadge"></span></button>
      <button class="nav-item" data-module="data">Данные</button>
      <div class="save-badge" id="saveBadge">Сохранено</div>
    </nav>
    <main id="content"></main>
  </div>
  <script src="/js/mobile.bundle.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
