name: Ошибка / Bug
description: Что-то работает не так / Something doesn't work
body:
  - type: textarea
    id: what
    attributes:
      label: Что случилось / What happened
      description: Что делали, что ожидали увидеть и что получилось. Скриншот очень помогает. / What you did, what you expected and what happened instead. A screenshot helps a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия Fictaris / Fictaris version
      description: Настройки → Приложение → О приложении / Settings → App → About
      placeholder: "0.3.23"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Система / System
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
        - Android
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Не прикладывайте файлы проекта целиком, если в них то, что вы не хотите показывать: репозиторий открытый. / Don't attach your project files if they contain anything private: this repository is public.
