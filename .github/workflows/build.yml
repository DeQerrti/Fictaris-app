# Сборка приложения под три системы — по образцу TasteID
# (https://github.com/DeQerrti/tasteid-app/blob/main/.github/workflows/build.yml).
#
# Синтаксис-проверка гоняется на каждый push и pull request — она быстрая.
# Установщики собираются только по тегу вида v1.2.3 или вручную с вкладки
# Actions: собирать их на каждый коммит значит тратить машинное время
# впустую, а результат нужен только когда версию действительно выпускаешь.
name: Проверки и сборка

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        # Без значения по умолчанию: случайный запуск не должен создать
        # черновик какой-то старой версии.
        description: "Версия для релиза, как в package.json (например 0.3.23)"
        required: true
      publish:
        description: "Опубликовать сразу (иначе релиз останется черновиком)"
        required: false
        type: boolean
        default: false

jobs:
  check:
    name: Проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          for f in $(find core electron app/js mobile/src -name '*.js'); do
            node --check "$f" || exit 1
          done
      # Логика без отрисовки: история версий, запись на диск, синхронизация,
      # упоминания, календарь, проверка данных (tests/).
      - run: npm test

  build:
    name: Установщики
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # Без этого шаг с релизом падает на 403: по умолчанию токен рабочего
    # процесса умеет только читать, а ему нужно создать релиз и залить
    # в него установщики.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:${{ matrix.target }}
        env:
          # Приложение не подписано, и это осознанно: подпись стоит денег
          # и всё равно не убирает предупреждение Windows целиком. Без
          # этой переменной electron-builder попробует подписать сам и
          # упадёт на отсутствующем сертификате.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Описание релиза из CHANGELOG.md
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: bash scripts/release-notes.sh "$VERSION" release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          # По тегу имя релиза берётся из него самого; при ручном запуске
          # тега нет, поэтому версию спрашиваем во входных данных.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
          draft: true
          fail_on_unmatched_files: false

  android:
    name: Приложение для телефона
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Android собирается Gradle, а Gradle — это Java. На готовых
      # машинах GitHub сам Android SDK уже стоит, ставить нужно только её.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Мост телефона собирается в один файл и кладётся к страницам, а
      # cap sync копирует их вместе с ним в assets/public — только после
      # этого есть смысл собирать Gradle-проект.
      - run: npm run build:mobile
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      # Release-сборка, подписанная постоянным ключом из секретов репозитория
      # (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
      # ANDROID_KEY_PASSWORD): только с одним и тем же ключом Android ставит
      # новую версию поверх старой, не удаляя приложение и данные. Ключ в
      # открытом репозитории не лежит — он приходит из секретов и живёт
      # только на время сборки. Пока секретов нет, собирается отладочная
      # версия, как раньше (её каждый раз подписывает новый ключ).
      - name: Собрать APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/fictaris.apk"
            rm -f "$RUNNER_TEMP/release.keystore"
          else
            echo "::warning::Нет ключа подписи Android в секретах – собираю отладочную версию"
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/fictaris.apk"
          fi
      - name: Назвать файл по-человечески
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP/fictaris.apk" "dist/Fictaris-${VERSION#v}.apk"
          bash scripts/release-notes.sh "$VERSION" release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          body_path: release-notes.md
          files: dist/*.apk
          draft: true
          fail_on_unmatched_files: false

  # Черновик на время сборки нужен затем, чтобы три параллельных job'а
  # (Windows/macOS/Linux) не публиковали релиз по частям, пока другие ещё
  # заливают файлы; как только все, включая Android, закончили —
  # публикуем. По тегу — всегда (тег толкают только ради настоящего
  # релиза). При ручном запуске — только если явно попросили галочкой
  # publish, иначе релиз так и остаётся черновиком с уже залитыми
  # установщиками — сборку и итоговую публикацию можно развести по
  # времени и по тому, кто нажимает.
  publish:
    name: Опубликовать релиз
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: gh release edit "$TAG" --draft=false --repo "${{ github.repository }}"
