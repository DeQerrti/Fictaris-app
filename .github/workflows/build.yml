# Сборка приложения под три системы — по образцу TasteID
# (https://github.com/DeQerrti/tasteid-app/blob/main/.github/workflows/build.yml).
#
# Синтаксис-проверка гоняется на каждый push и pull request — она быстрая.
# Установщики собираются только по тегу вида v1.2.3 или вручную с вкладки
# Actions: собирать их на каждый коммит значит тратить машинное время
# впустую, а результат нужен только когда версию действительно выпускаешь.
name: Проверки и сборка

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для релиза (например 0.1.0)"
        required: true
        default: "0.1.0"
      publish:
        description: "Опубликовать сразу (иначе релиз останется черновиком)"
        required: false
        type: boolean
        default: false

jobs:
  check:
    name: Проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          for f in $(find core electron app/js mobile/src -name '*.js'); do
            node --check "$f" || exit 1
          done

  build:
    name: Установщики
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # Без этого шаг с релизом падает на 403: по умолчанию токен рабочего
    # процесса умеет только читать, а ему нужно создать релиз и залить
    # в него установщики.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:${{ matrix.target }}
        env:
          # Приложение не подписано, и это осознанно: подпись стоит денег
          # и всё равно не убирает предупреждение Windows целиком. Без
          # этой переменной electron-builder попробует подписать сам и
          # упадёт на отсутствующем сертификате.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: softprops/action-gh-release@v3
        with:
          # По тегу имя релиза берётся из него самого; при ручном запуске
          # тега нет, поэтому версию спрашиваем во входных данных.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
          draft: true
          fail_on_unmatched_files: false

  android:
    name: Приложение для телефона
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Android собирается Gradle, а Gradle — это Java. На готовых
      # машинах GitHub сам Android SDK уже стоит, ставить нужно только её.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Мост телефона собирается в один файл и кладётся к страницам, а
      # cap sync копирует их вместе с ним в assets/public — только после
      # этого есть смысл собирать Gradle-проект.
      - run: npm run build:mobile
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      # Сборка отладочная, и это осознанно: обычную Android отказывается
      # ставить без подписи, а для подписи нужен ключ, который в открытом
      # репозитории держать нельзя. Отладочная подписана общим ключом и
      # ставится с телефона как есть.
      - run: ./gradlew assembleDebug
        working-directory: android
      - name: Назвать файл по-человечески
        run: |
          version=${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Fictaris-${version#v}.apk"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          files: dist/*.apk
          draft: true
          fail_on_unmatched_files: false

  # Черновик на время сборки нужен затем, чтобы три параллельных job'а
  # (Windows/macOS/Linux) не публиковали релиз по частям, пока другие ещё
  # заливают файлы; как только все, включая Android, закончили —
  # публикуем. По тегу — всегда (тег толкают только ради настоящего
  # релиза). При ручном запуске — только если явно попросили галочкой
  # publish, иначе релиз так и остаётся черновиком с уже залитыми
  # установщиками — сборку и итоговую публикацию можно развести по
  # времени и по тому, кто нажимает.
  publish:
    name: Опубликовать релиз
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: gh release edit "$TAG" --draft=false --repo "${{ github.repository }}"
